name: build

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  python-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build + smoke backend
        run: bash scripts/build-python-macos.sh
      - name: Upload macOS smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: build/pyinstaller/smoke-macos.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-cowork-backend-macos
          path: dist/my-cowork-backend
          if-no-files-found: warn
      - name: Archive Chromium for macOS packaging
        run: |
          test -n "$(find build/playwright-browsers -name 'Google Chrome for Testing' -type f -print -quit)"
          tar -czf dist/playwright-browsers-macos.tar.gz -C build playwright-browsers
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-browsers-macos
          path: dist/playwright-browsers-macos.tar.gz
          if-no-files-found: error
          compression-level: 0

  python-windows:
    runs-on: windows-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build + smoke backend
        shell: pwsh
        run: ./scripts/build-python-windows.ps1
      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: build/pyinstaller/smoke-windows*.log
          if-no-files-found: ignore
      - name: Archive backend
        shell: bash
        run: |
          test -f dist/python_runtime/python.exe
          tar -czf dist/python_runtime.tar.gz -C dist python_runtime
          ls -lh dist/python_runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-backend-windows
          path: dist/python_runtime.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Archive Chromium for Windows packaging
        shell: bash
        run: |
          test -n "$(find build/playwright-browsers -name 'chrome.exe' -type f -print -quit)"
          tar -czf dist/playwright-browsers-windows.tar.gz -C build playwright-browsers
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-browsers-windows
          path: dist/playwright-browsers-windows.tar.gz
          if-no-files-found: error
          compression-level: 0

  electron:
    needs: [python-macos]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch backend binary
        uses: actions/download-artifact@v4
        with:
          name: my-cowork-backend-macos
          path: dist
      - name: Fetch Chromium
        uses: actions/download-artifact@v4
        with:
          name: my-cowork-browsers-macos
          path: dist
      - name: Extract Chromium
        run: |
          tar -xzf dist/playwright-browsers-macos.tar.gz -C build
          test -n "$(find build/playwright-browsers -name 'Google Chrome for Testing' -type f -print -quit)"
      - run: chmod +x dist/my-cowork-backend
      - run: npm ci
      - name: Fetch OfficeCLI
        env:
          OFFICECLI_PLATFORM: mac-arm64
        run: bash scripts/fetch-officecli.sh
      - name: Verify extraResources
        run: |
          test -f dist/my-cowork-backend
          test -d build/playwright-browsers
          test -x resources/bin/officecli
          ls -lh dist/my-cowork-backend resources/bin/officecli resources/prebuilt build/playwright-browsers
      - run: npm run build
      - name: Package macOS app
        env:
          DEBUG: electron-builder
        run: npx electron-builder --config build/electron-builder.yml --mac --publish never
      - name: Smoke bundled Chromium in macOS app
        run: |
          APP=$(find release -path '*/Contents/Resources/python_bin' -type f -print -quit)
          test -n "$APP"
          chmod +x "$APP"
          "$APP" --browser-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap

  electron-windows:
    needs: [python-windows]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch backend binary
        uses: actions/download-artifact@v4
        with:
          name: my-cowork-backend-windows
          path: dist
      - name: Fetch Chromium
        uses: actions/download-artifact@v4
        with:
          name: my-cowork-browsers-windows
          path: dist
      - name: Extract backend
        shell: bash
        run: |
          tar -xzf dist/python_runtime.tar.gz -C dist
          test -f dist/python_runtime/python.exe
          ls -lh dist/python_runtime/python.exe
      - name: Extract Chromium
        shell: bash
        run: |
          tar -xzf dist/playwright-browsers-windows.tar.gz -C build
          test -n "$(find build/playwright-browsers -name 'chrome.exe' -type f -print -quit)"
      - run: npm ci
      - name: Fetch OfficeCLI
        shell: bash
        env:
          OFFICECLI_PLATFORM: win-x64
        run: bash scripts/fetch-officecli.sh
      - name: Verify extraResources
        shell: bash
        run: |
          test -f dist/python_runtime/python.exe
          test -d build/playwright-browsers
          test -f resources/bin/officecli.exe
          ls -lh dist/python_runtime/python.exe resources/bin/officecli.exe resources/prebuilt build/playwright-browsers
      - run: npm run build
      - name: Package Windows installer
        env:
          DEBUG: electron-builder
        run: npx electron-builder --config build/electron-builder.yml --win --publish never
      - name: Smoke bundled Chromium in Windows app
        shell: pwsh
        run: |
          $bin = Get-ChildItem release -Recurse -Filter python.exe | Where-Object { $_.FullName -match 'python_runtime' } | Select-Object -First 1
          if (-not $bin) { throw 'Packaged backend missing' }
          & $bin.FullName --browser-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Chromium smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-win
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [electron, electron-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: my-cowork-mac
          path: dist-mac
      - uses: actions/download-artifact@v4
        with:
          name: my-cowork-win
          path: dist-win
      - name: Resolve release tag
        id: rel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist-mac dist-win
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-mac/*.dmg
            dist-mac/*.zip
            dist-mac/*.yml
            dist-mac/*.blockmap
            dist-win/*.exe
            dist-win/*.zip
            dist-win/*.yml
            dist-win/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
