name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  python-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build + smoke backend
        run: bash scripts/build-python-macos.sh
      - name: Upload macOS smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-macos
          path: build/pyinstaller/smoke-macos.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-cowork-backend-macos
          path: dist/my-cowork-backend
          if-no-files-found: warn

  python-windows:
    runs-on: windows-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build + smoke backend
        shell: pwsh
        run: ./scripts/build-python-windows.ps1
      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: build/pyinstaller/smoke-windows*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-cowork-backend-windows
          path: dist/my-cowork-backend.exe
          if-no-files-found: warn

  electron:
    needs: [python-macos]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch backend binary
        uses: actions/download-artifact@v4
        with:
          name: my-cowork-backend-macos
          path: dist
      - run: chmod +x dist/my-cowork-backend
      - run: npm ci
      - name: Fetch OfficeCLI
        env:
          OFFICECLI_PLATFORM: mac-arm64
        run: bash scripts/fetch-officecli.sh
      - name: Verify extraResources
        run: |
          test -f dist/my-cowork-backend
          test -x resources/bin/officecli
          ls -lh dist/my-cowork-backend resources/bin/officecli resources/prebuilt
      - run: npm run build
      - name: Package macOS app
        env:
          DEBUG: electron-builder
        run: npx electron-builder --config build/electron-builder.yml --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-mac
          path: |
            release/*.dmg
            release/*.zip

  electron-windows:
    needs: [python-windows]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch backend binary
        uses: actions/download-artifact@v4
        with:
          name: my-cowork-backend-windows
          path: dist
      - run: npm ci
      - name: Fetch OfficeCLI
        shell: bash
        env:
          OFFICECLI_PLATFORM: win-x64
        run: bash scripts/fetch-officecli.sh
      - name: Verify extraResources
        shell: bash
        run: |
          test -f dist/my-cowork-backend.exe
          test -f resources/bin/officecli.exe
          ls -lh dist/my-cowork-backend.exe resources/bin/officecli.exe resources/prebuilt
      - run: npm run build
      - name: Package Windows installer
        env:
          DEBUG: electron-builder
        run: npx electron-builder --config build/electron-builder.yml --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: my-cowork-win
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
