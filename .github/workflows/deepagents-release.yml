name: Publish verified dependency upgrade
on:
  push:
    branches: [main, master]
    paths: ['backend/pyproject.toml', 'backend/uv.lock']
permissions:
  contents: write
  actions: write
jobs:
  release:
    if: vars.DEEPAGENTS_AUTO_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dispatch normal project build
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || github.token }}
        run: gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f revision="$GITHUB_SHA"
