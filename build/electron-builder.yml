appId: com.my-cowork.app
productName: MyCowork
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
mac:
  icon: build/icon.png
  identity: null
  target:
    - dmg
  category: public.app-category.productivity
  extraResources:
    - from: dist/my-cowork-backend
      to: python_bin
    - from: resources/prebuilt
      to: prebuilt
      filter:
        - "**/*"
        - "!cache/**"
        - "!**/*.pyc"
    - from: resources/bin/officecli
      to: bin/officecli
    - from: resources/example-skills
      to: resources/example-skills
    - from: skills
      to: skills
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
  extraResources:
    - from: dist/my-cowork-backend.exe
      to: python_bin.exe
    - from: resources/prebuilt
      to: prebuilt
      filter:
        - "**/*"
        - "!cache/**"
        - "!**/*.pyc"
        - "!.gitignore"
    - from: resources/bin/officecli.exe
      to: bin/officecli.exe
    - from: resources/example-skills
      to: resources/example-skills
    - from: skills
      to: skills
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asar: true
