function workspace(){return `<div class="shell">${sidebar('200P算力中心建设投资估算')}<main class="main workspace"><section class="chat-pane"><div class="pane-top"><span class="round">${icon('users',15)}</span><span class="round">${icon('eye',15)}</span><span class="round">${icon('square',14)}</span></div><div class="chat-scroll"><div class="chat-bubble">帮我分析 200P 算力中心建设投资，并生成估算报告。</div><div class="response"><p>国产方案便宜 40%，但需配套国产软件生态调优团队</p><p><strong>落地三大点：</strong>GPU 供应、电力指标、算力消纳（必须先有客户）</p><h3>交付文件</h3><div class="artifact"><span class="doc">W</span><div><b>200P算力中心建设投资估算报告.docx</b><small>Word · .docx</small></div></div><p style="margin-top:16px">报告包含 11 个章节：概述 → 算力口径 → 技术路线 → 硬件规模 → 三方案分项估算 → 总投资对比 → 关键变量 → 风险提示 → 落地建议 → 结论，可直接用于立项评审或对外汇报。</p><div style="height:1px;background:#ececf4;margin:18px 0"></div><p>如需进一步细化（例如：<strong>指定某一方案做详细 BOQ 清单、加入 5 年 TCO 测算、对比特定机房等级、或按 FP16/FP8 口径重算</strong>），告诉我具体方向，我可以再生成 xlsx 详细测算表或更新报告。</p></div></div><div class="chat-bottom">${composer(true)}</div></section><section class="preview"><div class="preview-tabs"><span class="preview-tab">${icon('doc',12)}　200P算力中心建设投资估算报告.docx　×</span>＋</div><div class="preview-toolbar">${icon('doc',15)}　200P算力中心建设投资估算报告.docx <span>↓　⋯</span></div><div class="paper"><h1>200P算力中心建设投资估算报告</h1><h2>一、报告概述</h2><p>本报告针对 200P FLOPS（INT8）规模智能算力中心的建设投资进行系统性调研，涵盖主流技术路线、NVIDIA H100/H200、国产算力服务器、混合架构的硬件、网络、存储、机房基础设施、电力、冷却、软件平台及运维资金等。</p><p>基于项目论证与财务测算，本报告形成三种建设方案的分项投资对比与风险提示，供投资决策、立项评审与项目落地参考。</p><div class="rule"></div><h2>二、200P算力的定义与口径澄清</h2><p>业界“200P”通常指 200 PFLOPS 运行及浮点运算能力。需要厘清三种常见口径：（1）FP16/BF16 精度；（2）FP8 精度；（3）INT8 精度。不同口径对应设备数量与整体成本差异显著。</p><p>本报告以 INT8 200 PFLOPS 为基准，结合可用算力、立项建设周期和设备可获得性，综合评估不同方案。</p><div class="rule"></div><h2>三、主流技术路线对比</h2><p>方案 A：NVIDIA H100/H200 进口路线，单卡性能强，生态成熟，方案部署确定性高。方案 B：国产算力路线，投资成本可控，但需投入软件适配和系统优化。方案 C：混合架构，在成本与落地效率之间取得平衡。</p><div class="rule"></div><h2>四、硬件规模测算（200P INT8）</h2><p>全服务器 H100 时，理论上需约 500–700 张卡达到 200P；但受 NVLink 网络效率影响，需按有效算力计算。根据典型组网、集群调度效率和项目交付要求，建议预留容量冗余和机房扩展空间。</p><div class="rule"></div><h2>五、方案 A：NVIDIA H100/H200 进口路线投资估算</h2><p>以服务器、网络、存储、机房配套和软件平台为主要成本项，测算一次性资本开支和后续维护费用。</p></div></section></main></div>`}
function hubBase(content,side,title){return `<div class="shell"><main class="main hub"> <div class="hub-tabs">${[['home','主页'],['assistants','智能体'],['skills','连接器'],['models','浏览器'],['settings','设置']].map(([id,label],i)=>`<span class="hub-tab ${i===1?'active':''}">${icon(['home','users','hammer','eye','settings'][i],14)}${label}</span>`).join('')}</div><div class="hub-body"><aside class="hub-side">${['模型','技能','办公助手','记忆'].map(s=>`<div class="${s===side?'active':''}">${s}</div>`).join('')}</aside><div class="hub-content"><div class="hub-title">${title}</div>${content}</div></div></main></div>`}
